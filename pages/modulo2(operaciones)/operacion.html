<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de operación</title>
    <link rel="stylesheet" href="../../css/ui.css">
</head>
<body>
    <div class="sidebar" id="sidebar">
        <nav>
            <ul>
                <li>
                    <a class="menu" id="menu">
                        <img src="../../assets/icons/brand-icon.svg" alt="icon-brand" class="logo">
                        <span class="name">SURCO</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="../../assets/icons/home-icon.svg" alt="icon-home" class="home">
                        <span>Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="../../assets/icons/box-icon.svg" alt="icon-box" class="box">
                        <span>Inventario</span>
                    </a>
                </li>
                <li>
                    <a href="operaciones.html" class="selected">
                        <img src="../../assets/icons/task-icon.svg" alt="icon-task" class="task">
                        <span>Operaciones</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="../../assets/icons/customer-icon.svg" alt="icon-customer" class="customer">
                        <span>Clientes</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="../../assets/icons/vehicle-icon.svg" alt="icon-vehicle" class="vehicle">
                        <span>Vehículos</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="../../assets/icons/graph-icon.svg" alt="icon-graph" class="graph">
                        <span>Reportes</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="../../assets/icons/user-icon.svg" alt="icon-user" class="user">
                        <span>Usuarios</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="../../assets/icons/cycle-icon.svg" alt="icon-cycle" class="cycle">
                        <span>Sincronización</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>

    <main class="main" id="main">

        <div class="encabezado">
            <div>
                <h1 class="mb-0" id="titulo">Operación</h1>
                <p class="tenue mb-0">Operaciones &rsaquo; Detalle</p>
            </div>
            <a href="operaciones.html" class="btn btn--secundario">&larr; Volver</a>
        </div>

        <div id="zona-estado" aria-live="polite"></div>

        <div class="tabla-scroll" id="tabla-box">
            <table class="tabla">
                <thead>
                    <tr id="cabeza">
                    </tr>
                </thead>
                <tbody id="cuerpo">
                </tbody>
            </table>
        </div>

        <div id="contenido" class="oculto">
            <div id="aviso-global"></div>
            <div class="con-lateral">
                <div class="pila">
                    <div class="tarjeta" id="datos"></div>
                    <div id="bloque-partidas"></div>
                </div>
                <div class="tarjeta" id="estado-card"></div>
            </div>
        </div>

        <dialog class="dialogo" id="dlg">
            <form class="dialogo__cuerpo" id="dlg-form" novalidate>
                <h2 class="dialogo__titulo" id="dlg-titulo"></h2>
                <p class="dialogo__texto" id="dlg-texto"></p>
                <div id="dlg-campos"></div>
                <div id="dlg-error" aria-live="polite"></div>
                <div class="dialogo__pie">
                    <button type="button" class="btn btn--secundario" id="dlg-cancelar">Volver</button>
                    <button type="submit" class="btn" id="dlg-ok">Confirmar</button>
                </div>
            </form>
        </dialog>
    </main>
    <script src="../../js/navbar.js"></script>
    <script src="../../js/prueba.js"></script>
</body>
</html>
