<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#7e0c0c">
  <title>SURCO · Clientes, Vehículos y Usuarios</title>
  <link rel="stylesheet" href="/estilos/ui.css">
</head>
<body>
  <!-- Franja de conectividad (se muestra con body.sin-conexion) -->
  <div class="franja-offline" role="status">
    Sin conexión. Los cambios se guardarán en el dispositivo.
  </div>

  <!-- ===================== LOGIN ===================== -->
  <main id="login" class="contenedor" style="max-width:440px">
    <div class="tarjeta mt-5">
      <div class="centrado mb-5">
        <div aria-hidden="true" style="font-size:3rem;line-height:1">🌱</div>
        <h1 class="mt-3 mb-0">SURCO</h1>
        <p class="tenue">Control operativo agrícola</p>
      </div>

      <form id="login-form" novalidate>
        <div class="campo">
          <label class="campo__etiqueta" for="login-user">Usuario</label>
          <input class="campo__control" type="text" id="login-user"
                 placeholder="Nombre de usuario" value="admin" autocomplete="username">
        </div>
        <div class="campo">
          <label class="campo__etiqueta" for="login-pass">Contraseña</label>
          <input class="campo__control" type="password" id="login-pass"
                 placeholder="••••••••" value="demo" autocomplete="current-password">
        </div>

        <fieldset class="mb-5" style="border:0;padding:0;margin-left:0;margin-right:0">
          <legend class="campo__etiqueta">Vista previa del prototipo</legend>
          <div class="fila">
            <label class="opcion">
              <input type="radio" name="rol" value="admin" checked> Administrador
            </label>
            <label class="opcion">
              <input type="radio" name="rol" value="operador"> Operador de campo
            </label>
          </div>
        </fieldset>

        <button type="submit" class="btn btn--bloque">Iniciar sesión</button>
      </form>
    </div>
  </main>

  <!-- ===================== APLICACIÓN ===================== -->
  <div id="app" class="app oculto">
    <header class="barra">
      <p class="barra__titulo"><span aria-hidden="true">🌱</span> SURCO</p>
      <div class="barra__acciones">
        <span class="chip-pendientes" id="rol-actual">Administración</span>
        <button type="button" class="btn btn--secundario btn--pequeno" id="btn-logout">Cerrar sesión</button>
      </div>
    </header>

    <nav class="pestanas" id="pestanas" role="tablist" aria-label="Módulos"></nav>

    <main id="content" class="contenedor" role="tabpanel" tabindex="-1"></main>
  </div>

  <!-- Diálogo único para todos los formularios -->
  <dialog id="dialogo" class="dialogo" aria-labelledby="dialogo-titulo"></dialog>

  <!-- Mensaje flotante de confirmación -->
  <div id="toast" class="aviso aviso--exito oculto" role="status" aria-live="polite"
       style="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:10;box-shadow:var(--sombra-alta);max-width:90vw"></div>

  <script src="app.js"></script>
</body>
</html>
